[project]
name = "laya-server"
version = "0.1.0"
description = "System One HTTP sidecar for auto-qa: serves the laya decision model behind the same /v1/systemone API as kev."
requires-python = ">=3.10"
dependencies = [
    "laya>=0.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laya_server"]
